<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Finder</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-labelledby="enrolled-heading">
      <h2 id="enrolled-heading">Enrolled in</h2>
      <p id="enrolled-status" class="status" aria-live="polite"></p>
      <ul id="enrolled-list" class="enrolled-list"></ul>
    </aside>

    <main class="main">
      <h1>Course Finder</h1>
      <form id="search-form" class="search" role="search">
        <label for="search-input">Search courses</label>
        <input id="search-input" type="search" name="q" placeholder="Code or title, e.g. COE 318" autocomplete="off">
      </form>
      <p id="results-status" class="status" role="status" aria-live="polite"></p>
      <ul id="results" class="results" aria-label="Search results"></ul>
    </main>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
